<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Private Journey</title>
  <style>
    :root{color-scheme:light;--ink:#17191c;--muted:#686d76;--line:#d9dde5;--blue:#246bfd;--surface:#fff;--bg:#f4f5f7;--error:#a52a2a}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .lock{width:min(100%,390px);padding:30px 26px;border-radius:16px;background:var(--surface);box-shadow:0 6px 20px rgba(27,31,38,.08)}
    .mark{display:grid;width:46px;height:46px;margin-bottom:28px;place-items:center;border-radius:13px;background:#e8efff;color:var(--blue);font-size:24px;font-weight:800}
    .eyebrow{margin:0 0 7px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.1em}
    h1{margin:0;font-size:27px;line-height:1.16;letter-spacing:-.03em;text-wrap:balance}
    .intro{max-width:32ch;margin:13px 0 24px;color:var(--muted);font-size:14px;line-height:1.65;text-wrap:pretty}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
    .field{display:flex;gap:9px}
    input{min-width:0;flex:1;height:48px;padding:0 14px;border:1px solid #c9ced8;border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .18s,box-shadow .18s}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,107,253,.15)}
    button{height:48px;padding:0 18px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:750;cursor:pointer;transition:background .18s,transform .12s}
    button:hover{background:#1458d7}button:active{transform:translateY(1px)}button:disabled{cursor:wait;opacity:.62}
    .status{min-height:21px;margin:11px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.status.error{color:var(--error)}
    .privacy{display:flex;gap:8px;align-items:flex-start;margin:24px 0 0;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}.privacy b{color:#3f4650}
    @media(max-width:520px){body{align-items:start;padding:18px 12px}.lock{margin-top:8vh;padding:26px 20px}.field{display:grid;grid-template-columns:1fr}button{width:100%}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="lock" aria-labelledby="lock-title">
    <div class="mark" aria-hidden="true">⌁</div>

    <p class="intro">输入同行人提供的访问密码。验证与解密只在你的设备上完成。</p>

      <label for="password">访问密码</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required />
        <button id="unlock" type="submit">解锁行程</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy"><span aria-hidden="true">◉</span><span><b>AES-256 加密</b><br />公开页面不含行程原文或访问密码。</span></p>

    const form=document.getElementById('unlock-form');
    const passwordInput=document.getElementById('password');
    const button=document.getElementById('unlock');
    const status=document.getElementById('status');
    const decode=(value)=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
    const unlock=async(password)=>{
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(vault.salt),iterations:vault.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(vault.iv)},key,decode(vault.payload));
      return JSON.parse(new TextDecoder().decode(plain));
    };
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      button.disabled=true;passwordInput.disabled=true;status.className='status';status.textContent='正在解密…';
      try{
        const data=await unlock(passwordInput.value);
        document.title='南加州九日边境环线';
        document.head.querySelectorAll('style').forEach(node=>node.remove());
        const style=document.createElement('style');style.textContent=data.css;document.head.append(style);
        document.body.innerHTML='<div id="root"></div>';
        const script=document.createElement('script');script.type='module';script.textContent=data.js;document.body.append(script);
      }catch(error){
        button.disabled=false;passwordInput.disabled=false;passwordInput.select();status.className='status error';status.textContent='密码不正确，请重新输入。';
      }
    });
    passwordInput.focus();
  </script>
